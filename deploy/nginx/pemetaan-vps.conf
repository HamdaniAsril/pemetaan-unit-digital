# Situs Pemetaan Unit Digital di Nginx bersama (akupeta_nginx).
# KHUSUS VPS 43.173.8.198 (Nginx bersama). Server lain: lihat pemetaan-server.conf.template.
# Salin ke /home/akupeta/akupeta/docker/prod/nginx/conf.d/pemetaan.conf, lalu:
#   docker exec akupeta_nginx nginx -t && docker exec akupeta_nginx nginx -s reload
# pemetaan_app dijangkau lewat jaringan akupeta_akupeta_net; webhook di host lewat gateway 172.18.0.1.
# Nama container diresolusi saat ada permintaan (resolver Docker + variabel), BUKAN saat Nginx start:
# bila pemetaan_app mati, hanya situs ini yang 502; Nginx bersama tetap lolos `nginx -t` dan tetap bisa start.
server {
    listen 80;
    listen [::]:80;
    server_name pemetaan.nekomade.com;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pemetaan.nekomade.com;

    ssl_certificate /etc/letsencrypt/live/pemetaan.nekomade.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pemetaan.nekomade.com/privkey.pem;

    client_max_body_size 10m;

    location = /hooks/github {
        # payload push GitHub bisa melewati batas bawaan Nginx 1 MB
        client_max_body_size 5m;
        proxy_pass http://172.18.0.1:9010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $pemetaan_hulu http://pemetaan_app:8080;

    location / {
        proxy_pass $pemetaan_hulu;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
}
