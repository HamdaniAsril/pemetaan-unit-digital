name: pemetaan

# Pengaturan DASAR, berlaku di server mana pun (server Pemda, VPS, dan seterusnya).
# Aplikasi hanya mendengar di 127.0.0.1; Nginx di server yang meneruskan dari domain.
# Tambahan khusus server ditaruh di berkas overlay (contoh: compose.vps.yaml) dan dipilih lewat
# COMPOSE_FILE di /etc/pemetaan/deploy.env.

x-app: &app
  build:
    context: .
    target: produksi
  image: pemetaan-app:prod
  env_file: .env
  restart: unless-stopped
  volumes:
    - pemetaan_storage:/var/www/html/storage

services:
  # Nama layanan JANGAN "app": di VPS, jaringan Nginx dipakai bersama akupeta, yang mengirim PHP ke host "app".
  # Nama layanan otomatis menjadi alias DNS di setiap jaringan, jadi "app" akan merebut lalu lintas akupeta.
  pemetaan:
    <<: *app
    container_name: pemetaan_app
    ports:
      - "127.0.0.1:${PEMETAAN_PORT:-8090}:8080"
    mem_limit: ${PEMETAAN_MEM:-256m}
    environment:
      PEMETAAN_PERAN: web

  scheduler:
    <<: *app
    container_name: pemetaan_scheduler
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    mem_limit: 128m
    stop_signal: SIGTERM
    healthcheck:
      disable: true
    environment:
      PEMETAAN_PERAN: scheduler
      AUTORUN_ENABLED: "false"
    depends_on:
      - pemetaan

volumes:
  pemetaan_storage:
