name: pemetaan

x-app: &app
  build:
    context: .
    target: produksi
  image: pemetaan-app:prod
  env_file: .env
  restart: unless-stopped
  volumes:
    - pemetaan_storage:/var/www/html/storage

services:
  # Nama layanan JANGAN "app": jaringan proxy dipakai bersama akupeta, yang Nginx-nya mengirim PHP ke host "app".
  # Nama layanan otomatis menjadi alias DNS di setiap jaringan, jadi "app" akan merebut lalu lintas akupeta.
  pemetaan:
    <<: *app
    container_name: pemetaan_app
    # 127.0.0.1:8090 untuk SSH tunnel; publik hanya lewat Nginx bersama (jaringan proxy).
    ports:
      - "127.0.0.1:8090:8080"
    networks: [default, proxy]
    mem_limit: 256m
    environment:
      PEMETAAN_PERAN: web

  scheduler:
    <<: *app
    container_name: pemetaan_scheduler
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    mem_limit: 128m
    stop_signal: SIGTERM
    healthcheck:
      disable: true
    environment:
      PEMETAAN_PERAN: scheduler
      AUTORUN_ENABLED: "false"
    depends_on:
      - pemetaan

volumes:
  pemetaan_storage:

networks:
  default:
  # Jaringan milik Nginx bersama (akupeta_nginx), supaya Nginx bisa menjangkau pemetaan_app:8080.
  proxy:
    external: true
    name: akupeta_akupeta_net
